syntax = "proto3";
package book;

service BookService {
  rpc GetBook(BookRequest) returns (Book) {}
  rpc CreateBook(Book) returns (Book) {}
  rpc UpdateBook(Book) returns (Book) {}
  rpc DeleteBook(BookRequest) returns (DeleteResponse) {}
}

message Book {
  int32 id = 1;
  string title = 2;
  string edition = 3;
  int32 copyright = 4;
  string language = 5;
  int32 pages = 6;
  string author = 7;
  string publisher = 8;
}

message BookRequest {
  int32 id = 1;
}

message DeleteResponse {
  int32 id = 1;
  bool deleted = 2;
  string message = 3;
}

message Empty {}